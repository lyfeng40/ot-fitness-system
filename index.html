<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職能治療運動追蹤系統 (雲端連線版)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .print-area { background: white; }
        
        @media print {
            .no-print { display: none !important; }
            .print-area { padding: 0 !important; margin: 0 !important; width: 100% !important; }
            body { background-color: white; }
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* PDF 專用頁面容器設定 */
        .pdf-page {
            height: 275mm; /* 固定高度防止溢出 */
            width: 100%;
            overflow: hidden;
            page-break-after: always;
            position: relative;
            background: white;
        }
        .pdf-page:last-child {
            page-break-after: auto;
        }
        
        /* 互動圖表按鈕樣式 */
        .chart-btn {
            transition: all 0.2s;
            border: 1px solid #e5e7eb;
        }
        .chart-btn.active {
            background-color: #86efac;
            border-color: #16a34a;
            font-weight: 500;
        }
        .chart-btn .indicator {
            height: 4px;
            width: 20px;
            display: inline-block;
            margin-left: 6px;
            border-radius: 2px;
        }
        
        /* 下拉選單 */
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 200px; box-shadow: 0px 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; border-radius: 0.5rem; z-index: 20; max-height: 250px; overflow-y: auto; }
        .dropdown:hover .dropdown-content { display: block; }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // --- 圖表元件 ---
        const ChartComponent = ({ type, data, options }) => {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !window.Chart) return;
                if (chartInstanceRef.current) chartInstanceRef.current.destroy();

                try {
                    const ctx = canvasRef.current.getContext('2d');
                    chartInstanceRef.current = new window.Chart(ctx, { type, data, options: options || {} });
                } catch (err) { console.error(err); }
                return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
            }, [type, data, options]);

            return <canvas ref={canvasRef} />;
        };

        const Line = (props) => <ChartComponent type="line" {...props} />;
        const Radar = (props) => <ChartComponent type="radar" {...props} />;

        // --- 互動式圖表容器 ---
        const InteractiveChart = ({ title, datasets, labels, initialSelected = [], options = {} }) => {
            const [selectedKeys, setSelectedKeys] = useState(initialSelected.length > 0 ? initialSelected : datasets.map(d => d.label));

            const toggleKey = (key) => {
                setSelectedKeys(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);
            };

            const chartData = {
                labels: labels,
                datasets: datasets.filter(d => selectedKeys.includes(d.label))
            };

            return (
                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 h-full flex flex-col">
                    <h3 className="text-lg font-bold text-gray-700 mb-3 text-center">{title}</h3>
                    <div className="flex flex-wrap gap-2 mb-2 justify-center">
                        {datasets.map(d => (
                            <button 
                                key={d.label} 
                                onClick={() => toggleKey(d.label)}
                                className={`chart-btn px-3 py-1 rounded-md text-sm flex items-center ${selectedKeys.includes(d.label) ? 'active' : 'bg-white text-gray-600'}`}
                            >
                                {d.label}
                                <span className="indicator" style={{ backgroundColor: d.borderColor }}></span>
                            </button>
                        ))}
                    </div>
                    <div className="flex-grow min-h-[200px] relative">
                        {selectedKeys.length > 0 ? <Line data={chartData} options={{ maintainAspectRatio: false, plugins: { legend: { display: false } }, ...options }} /> 
                        : <div className="flex items-center justify-center h-full text-gray-400 text-sm">請點擊上方按鈕選擇顯示項目</div>}
                    </div>
                </div>
            );
        };

        // --- 邏輯與標準 ---
        const getRocSessionFromGregorian = (gregorianDateStr) => {
            if (!gregorianDateStr) return '';
            const parts = gregorianDateStr.split('-');
            if (parts.length >= 2) {
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10);
                const rocYear = year - 1911;
                const mm = String(month).padStart(2, '0');
                return `${rocYear}.${mm}`;
            }
            return '';
        };

        const formatDateToRoc = (gregorianDateStr) => {
            if (!gregorianDateStr) return '';
            const str = String(gregorianDateStr).trim();
            const parts = str.split('-');
            if (parts.length >= 2) {
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10);
                const day = parts[2] ? parseInt(parts[2], 10) : null;
                const rocYear = year - 1911;
                const mm = String(month).padStart(2, '0');
                if (day !== null && !isNaN(day)) {
                    const dd = String(day).padStart(2, '0');
                    return `${rocYear}.${mm}.${dd}`;
                }
                return `${rocYear}.${mm}`;
            }
            return str;
        };

        const formatDateSafe = (dateVal) => {
            if (!dateVal) return "";
            
            // If it is a Date object
            if (dateVal instanceof Date) {
                if (isNaN(dateVal.getTime())) return "";
                const yyyy = dateVal.getFullYear();
                const mm = String(dateVal.getMonth() + 1).padStart(2, '0');
                const dd = String(dateVal.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            }

            // Convert to string and trim
            let str = String(dateVal).trim();
            if (!str) return "";

            // Clean up Chinese date notations like "民國62年5月2日" or "115年6月30日"
            str = str.replace(/民國|西元/g, '');
            str = str.replace(/[年月]/g, '-').replace(/日/g, '');

            // If it is a timestamp / serialized date from Excel/Google Sheets (numeric)
            if (/^\d+(\.\d+)?$/.test(str)) {
                const num = parseFloat(str);
                // Excel base date is 1899-12-30
                if (num > 20000 && num < 60000) {
                    const date = new Date((num - 25569) * 86400 * 1000);
                    const yyyy = date.getFullYear();
                    const mm = String(date.getMonth() + 1).padStart(2, '0');
                    const dd = String(date.getDate()).padStart(2, '0');
                    return `${yyyy}-${mm}-${dd}`;
                }
                // If it looks like a millisecond timestamp
                if (num > 1000000000000) {
                    const date = new Date(num);
                    const yyyy = date.getFullYear();
                    const mm = String(date.getMonth() + 1).padStart(2, '0');
                    const dd = String(date.getDate()).padStart(2, '0');
                    return `${yyyy}-${mm}-${dd}`;
                }
            }

            // Replace all dots, slashes, or backslashes with dashes
            str = str.replace(/[./\\]/g, '-');

            // 1. Match YYY-MM-DD or YYYY-MM-DD (e.g. "115-06-30" or "2026-06-30")
            let match = str.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})/);
            if (match) {
                let year = parseInt(match[1], 10);
                const mm = match[2].padStart(2, '0');
                const dd = match[3].padStart(2, '0');
                if (year < 1900) {
                    year += 1911; // Convert ROC to Gregorian
                }
                return `${year}-${mm}-${dd}`;
            }

            // 2. Match YYY-MM or YYYY-MM (e.g. "115-06" or "2026-06")
            match = str.match(/^(\d{2,4})-(\d{1,2})$/);
            if (match) {
                let year = parseInt(match[1], 10);
                const mm = match[2].padStart(2, '0');
                if (year < 1900) {
                    year += 1911; // Convert ROC to Gregorian
                }
                return `${year}-${mm}-01`; // Default day to 01
            }

            // Try standard JS Date parsing but format it locally
            const parsed = new Date(dateVal);
            if (!isNaN(parsed.getTime())) {
                const yyyy = parsed.getFullYear();
                const mm = String(parsed.getMonth() + 1).padStart(2, '0');
                const dd = String(parsed.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            }

            return "";
        };

        const mapRowToData = (row) => {
            // Unify R.O.C. session vs Gregorian assessment date
            // Parse evaluation date from database
            let dateVal = formatDateSafe(row['評估日期']);
            let sessionVal = row['評估次別'] ? String(row['評估次別']).trim() : '';

            // If date is missing, but session is present, fallback to parsing session as date (e.g. "115.06" -> "2026-06-01")
            if (!dateVal && sessionVal) {
                dateVal = formatDateSafe(sessionVal);
            }

            // If session is missing, but date is present, fallback to calculating ROC session from date (e.g. "2026-06-30" -> "115.06")
            if (!sessionVal && dateVal) {
                sessionVal = getRocSessionFromGregorian(dateVal);
            }

            return {
                id: row['唯一識別碼'] || '',
                bed_number: row['床號'] || '',
                name: row['姓名'] || '',
                sex: row['性別'] || '男',
                dob: formatDateSafe(row['出生年月日']),
                age: (row['年齡'] !== undefined && row['年齡'] !== null && row['年齡'] !== '') ? Number(row['年齡']) : '',
                session: sessionVal,
                date: dateVal,
                height: (row['身高(cm)'] !== undefined && row['身高(cm)'] !== null && row['身高(cm)'] !== '') ? Number(row['身高(cm)']) : '',
                weight: (row['體重(kg)'] !== undefined && row['體重(kg)'] !== null && row['體重(kg)'] !== '') ? Number(row['體重(kg)']) : '',
                bmi: (row['BMI'] !== undefined && row['BMI'] !== null && row['BMI'] !== '') ? Number(row['BMI']) : '',
                body_fat: (row['體脂肪(%)'] !== undefined && row['體脂肪(%)'] !== null && row['體脂肪(%)'] !== '') ? Number(row['體脂肪(%)']) : '',
                muscle_percent: (row['骨骼肌(%)'] !== undefined && row['骨骼肌(%)'] !== null && row['骨骼肌(%)'] !== '') ? Number(row['骨骼肌(%)']) : '',
                visceral_fat: (row['內臟脂肪'] !== undefined && row['內臟脂肪'] !== null && row['內臟脂肪'] !== '') ? Number(row['內臟脂肪']) : '',
                smi: (row['SMI'] !== undefined && row['SMI'] !== null && row['SMI'] !== '') ? Number(row['SMI']) : '',
                bmr: (row['基礎代謝(kcal)'] !== undefined && row['基礎代謝(kcal)'] !== null && row['基礎代謝(kcal)'] !== '') ? Number(row['基礎代謝(kcal)']) : '',
                body_age: (row['體年齡'] !== undefined && row['體年齡'] !== null && row['體年齡'] !== '') ? Number(row['體年齡']) : '',
                waist: (row['腰圍(cm)'] !== undefined && row['腰圍(cm)'] !== null && row['腰圍(cm)'] !== '') ? Number(row['腰圍(cm)']) : '',
                hip: (row['臀圍(cm)'] !== undefined && row['臀圍(cm)'] !== null && row['臀圍(cm)'] !== '') ? Number(row['臀圍(cm)']) : '',
                whr: (row['腰臀比'] !== undefined && row['腰臀比'] !== null && row['腰臀比'] !== '') ? Number(row['腰臀比']) : '',
                sit_ups_1m: (row['一分鐘仰臥起坐(次)'] !== undefined && row['一分鐘仰臥起坐(次)'] !== null && row['一分鐘仰臥起坐(次)'] !== '') ? Number(row['一分鐘仰臥起坐(次)']) : '',
                walk_6m: (row['六分鐘行走測驗(m)'] !== undefined && row['六分鐘行走測驗(m)'] !== null && row['六分鐘行走測驗(m)'] !== '') ? Number(row['六分鐘行走測驗(m)']) : '',
                flexibility: (row['柔軟度(cm)'] !== undefined && row['柔軟度(cm)'] !== null && row['柔軟度(cm)'] !== '') ? Number(row['柔軟度(cm)']) : '',
                sit_stand_30s: (row['30秒坐站測驗(次)'] !== undefined && row['30秒坐站測驗(次)'] !== null && row['30秒坐站測驗(次)'] !== '') ? Number(row['30秒坐站測驗(次)']) : '',
                ot_comments: row['職能治療評語與綜合分析'] || row['職能治療評語'] || localStorage.getItem(`ot_comments_${row['唯一識別碼']}_${sessionVal}`) || '',
                exercise_comments: row['運動處方建議'] || row['運動建議'] || localStorage.getItem(`exercise_comments_${row['唯一識別碼']}_${sessionVal}`) || '',
                nutrition_comments: row['營養建議'] || row['營養處方建議'] || localStorage.getItem(`nutrition_comments_${row['唯一識別碼']}_${sessionVal}`) || ''
            };
        };

        const renderListComments = (text) => {
            if (!text) return null;
            const lines = text.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map(line => {
                    // 清理任何開頭的項目符號如 "•", "-", "*", "1.", "2."
                    return line.replace(/^[\u2022\-\*\d+\.\s]+/, '');
                });
            return (
                <ul className="list-disc pl-4 space-y-0.5 text-gray-700 text-[11px]">
                    {lines.map((line, index) => {
                        // 檢查是否有「：」或「:」，有的話將前半段加粗
                        const colonIdx = line.indexOf('：');
                        const colonAltIdx = line.indexOf(':');
                        const idx = colonIdx !== -1 ? colonIdx : colonAltIdx;
                        if (idx !== -1) {
                            const prefix = line.substring(0, idx);
                            const suffix = line.substring(idx + 1);
                            return (
                                <li key={index}>
                                    <strong>{prefix}：</strong>{suffix}
                                </li>
                            );
                        }
                        return <li key={index}>{line}</li>;
                    })}
                </ul>
            );
        };

        const calcAge = (dob) => { 
            if(!dob) return ""; 
            const d = new Date(dob); 
            if (isNaN(d.getTime())) return "";
            return new Date().getFullYear() - d.getFullYear(); 
        };
        const calcBMI = (h, w) => (!h || !w || isNaN(h) || isNaN(w)) ? "" : w / Math.pow(h / 100, 2);
        const calcSMI = (h, w, mp) => (!h || !w || !mp || isNaN(h) || isNaN(w) || isNaN(mp)) ? "" : (w * mp / 100) / Math.pow(h / 100, 2);
        const calc6MWTPredicted = (sex, age, h, w) => {
            if (!sex || !age || !h || !w) return "";
            return (sex === "女") ? 2.11*h - 2.29*w - 5.78*age + 667 : 7.57*h - 1.76*w - 5.02*age - 309;
        };
        
        // 評語標準邏輯
        const getBodyFatStatus = (sex, val) => {
            if (sex === "男") {
                if (val < 10) return "低"; if (val < 20) return "標準"; if (val < 25) return "略高"; return "高";
            } else {
                if (val < 20) return "低"; if (val < 30) return "標準"; if (val < 35) return "略高"; return "高";
            }
        };

        const getMuscleStatus = (sex, val) => {
            if (sex === "男") {
                if (val < 32.9) return "低"; if (val < 35.8) return "標準"; if (val < 37.4) return "略高"; return "高";
            } else {
                if (val < 25.9) return "低"; if (val < 28) return "標準"; if (val < 29.1) return "略高"; return "高";
            }
        };

        const getVisceralFatStatus = (val) => {
            if (val <= 9) return "標準"; if (val <= 14) return "略高"; return "高";
        };

        const getSitStandTarget = (sex, age) => {
            if (age >= 3 && age <= 9) return sex === "男" ? 23.1 : 23.4;
            if (age >= 10 && age <= 19) return sex === "男" ? 25.5 : 24.3;
            if (age >= 20 && age <= 59) return sex === "男" ? 24.2 : 22.6;
            if (age >= 60) return sex === "男" ? 18.3 : 15.9;
            return 15;
        };

        const getBMRTarget = (sex, age) => {
            if (sex === '男') {
                if (age >= 15 && age <= 17) return 1570; if (age >= 18 && age <= 29) return 1520;
                if (age >= 30 && age <= 49) return 1520; if (age >= 50 && age <= 69) return 1380; if (age >= 70) return 1230;
            } else {
                if (age >= 15 && age <= 17) return 1270; if (age >= 18 && age <= 29) return 1180;
                if (age >= 30 && age <= 49) return 1140; if (age >= 50 && age <= 69) return 1100; if (age >= 70) return 1030;
            }
            return 1200;
        };

                const getNormThresholds = (type, sex, age) => {
            const resolvedSex = sex === '女' ? '女' : '男';
            const resolvedAge = Math.min(Math.max(Number(age) || 40, 20), 64);
            
            const normTables = {
                flexibility: {
                    '男': [
                        { min: 20, max: 24, t: [16.0, 23.0, 28.0, 35.0] },
                        { min: 25, max: 29, t: [15.0, 21.0, 26.0, 33.0] },
                        { min: 30, max: 34, t: [14.0, 20.0, 25.0, 31.0] },
                        { min: 35, max: 39, t: [13.0, 20.0, 25.0, 31.0] },
                        { min: 40, max: 44, t: [12.0, 19.0, 24.0, 30.0] },
                        { min: 45, max: 49, t: [12.0, 18.0, 24.0, 30.0] },
                        { min: 50, max: 54, t: [11.0, 18.0, 24.0, 30.0] },
                        { min: 55, max: 59, t: [10.0, 16.0, 22.0, 30.0] },
                        { min: 60, max: 64, t: [8.0, 15.0, 20.0, 28.0] }
                    ],
                    '女': [
                        { min: 20, max: 24, t: [20.0, 27.0, 33.0, 39.5] },
                        { min: 25, max: 29, t: [18.0, 25.0, 31.0, 37.0] },
                        { min: 30, max: 34, t: [18.0, 25.0, 30.0, 36.0] },
                        { min: 35, max: 39, t: [18.0, 25.0, 30.0, 36.0] },
                        { min: 40, max: 44, t: [17.0, 24.0, 30.0, 36.0] },
                        { min: 45, max: 49, t: [17.0, 24.0, 29.0, 36.0] },
                        { min: 50, max: 54, t: [17.0, 25.0, 30.0, 37.0] },
                        { min: 55, max: 59, t: [18.0, 25.0, 31.0, 37.0] },
                        { min: 60, max: 64, t: [18.0, 25.0, 31.0, 37.0] }
                    ]
                },
                sit_ups: {
                    '男': [
                        { min: 20, max: 24, t: [31, 36, 40, 46] },
                        { min: 25, max: 29, t: [29, 33, 37, 42] },
                        { min: 30, max: 34, t: [26, 30, 34, 40] },
                        { min: 35, max: 39, t: [24, 28, 31, 36] },
                        { min: 40, max: 44, t: [21, 25, 29, 34] },
                        { min: 45, max: 49, t: [19, 23, 27, 32] },
                        { min: 50, max: 54, t: [16, 21, 25, 30] },
                        { min: 55, max: 59, t: [14, 19, 22, 27] },
                        { min: 60, max: 64, t: [8, 14, 19, 24] }
                    ],
                    '女': [
                        { min: 20, max: 24, t: [21, 26, 30, 36] },
                        { min: 25, max: 29, t: [18, 23, 27, 31] },
                        { min: 30, max: 34, t: [15, 20, 23, 28] },
                        { min: 35, max: 39, t: [13, 18, 22, 26] },
                        { min: 40, max: 44, t: [12, 17, 21, 25] },
                        { min: 45, max: 49, t: [11, 15, 19, 24] },
                        { min: 50, max: 54, t: [7, 12, 16, 21] },
                        { min: 55, max: 59, t: [6, 10, 15, 20] },
                        { min: 60, max: 64, t: [1, 6, 11, 16] }
                    ]
                },
                sit_stand: {
                    '男': [
                        { min: 20, max: 54, t: [9, 11, 14, 15] },
                        { min: 55, max: 64, t: [6, 8, 11, 12] }
                    ],
                    '女': [
                        { min: 20, max: 54, t: [9, 11, 14, 15] },
                        { min: 55, max: 64, t: [6, 8, 11, 12] }
                    ]
                }
            };

            const list = normTables[type][resolvedSex];
            const row = list.find(r => resolvedAge >= r.min && resolvedAge <= r.max) || list[list.length - 1];
            return row.t;
        };

        const getNormScore = (type, val, sex, age) => {
            if (val === '' || val === null || val === undefined || isNaN(Number(val))) return 0;
            const v = Number(val);
            const t = getNormThresholds(type, sex, age);
            
            const [T1, T2, T3, T4] = t;
            let score = 0;
            if (v <= T1) {
                const baseVal = Math.max(0.1, T1);
                const targetT1 = type === 'sit_stand' ? 40 : 45;
                score = 10 + (Math.max(0, v) / baseVal) * (targetT1 - 10);
            } else if (v <= T2) {
                const startScore = type === 'sit_stand' ? 40 : 45;
                const endScore = 60;
                score = startScore + ((v - T1) / (T2 - T1)) * (endScore - startScore);
            } else if (v <= T3) {
                score = 60 + ((v - T2) / (T3 - T2)) * 20;
            } else if (v <= T4) {
                const startScore = 80;
                const endScore = type === 'sit_stand' ? 100 : 95;
                score = startScore + ((v - T3) / (T4 - T3)) * (endScore - startScore);
            } else {
                const startScore = type === 'sit_stand' ? 100 : 95;
                score = startScore + ((v - T4) / T4) * 20; // Clamped to 120
            }
            return Math.min(Math.max(score, 10), 120);
        };

        const getFitnessRating = (type, sex, age, val) => {
            if (val === '' || val === null || val === undefined || isNaN(Number(val))) {
                return { s: "-", c: "" };
            }
            const v = Number(val);
            const t = getNormThresholds(type, sex, age);
            
            if (type === 'sit_stand') {
                if (v <= t[0]) return { s: "高危防護", c: "text-red-600 font-bold" };
                if (v <= t[1]) return { s: "防跌邊緣", c: "text-orange-600 font-semibold" };
                if (v <= t[2]) return { s: "獨立安全", c: "text-blue-600 font-semibold" };
                return { s: "卓越復元", c: "text-green-600 font-bold" };
            }
            
            if (v <= t[0]) return { s: "不好", c: "text-red-600" };
            if (v <= t[1]) return { s: "稍差", c: "text-orange-600" };
            if (v <= t[2]) return { s: "普通", c: "text-blue-600" };
            if (v <= t[3]) return { s: "尚好", c: "text-green-600" };
            return { s: "很好", c: "text-green-700 font-bold" };
        };

        const getStandard = (type, val, sex, age) => {
            if (type === 'sit_stand') {
                const r = getFitnessRating('sit_stand', sex, age, val);
                return { status: `${r.s} (健康成人平均22.6)`, color: r.c };
            }
            if (type === 'walk') return { status: "-", color: "" };
            if (type === 'sit_ups') {
                const r = getFitnessRating('sit_ups', sex, age, val);
                return { status: r.s, color: r.c };
            }
            if (type === 'flexibility') {
                const r = getFitnessRating('flexibility', sex, age, val);
                return { status: r.s, color: r.c };
            }
            return { status: "-", color: "" };
        };

        const getBMIStatus = (bmi) => bmi < 18.5 ? "體重太輕" : bmi < 24 ? "標準體重" : bmi < 27 ? "過重" : bmi < 30 ? "輕度肥胖" : bmi < 35 ? "中度肥胖" : "重度肥胖";
        const getSarcopeniaStatus = (sex, smi) => (sex === "男" && smi < 7.0) || (sex === "女" && smi < 5.7) ? "肌少症" : "正常";
        const getWHRStatus = (sex, v) => (sex === "男" && v < 0.92) || (sex === "女" && v < 0.88) ? "標準" : "過高";

        const getClinicalAlerts = (records, currentRecord) => {
            if (!records || records.length < 2 || !currentRecord) return [];
            
            // Sort records chronologically
            const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
            const currentIndex = sorted.findIndex(r => r.id === currentRecord.id);
            if (currentIndex <= 0) return [];
            
            const cur = sorted[currentIndex];
            
            // Find the comparison record (target: 90 to 180 days ago, fallback to immediately preceding)
            const curTime = new Date(cur.date).getTime();
            let prev = null;
            
            // Search for a record in the 90-200 days window
            for (let i = 0; i < currentIndex; i++) {
                const t = new Date(sorted[i].date).getTime();
                const daysDiff = (curTime - t) / (1000 * 60 * 60 * 24);
                if (daysDiff >= 60 && daysDiff <= 200) {
                    prev = sorted[i];
                    break;
                }
            }
            
            // Fallback to the immediately preceding record
            if (!prev) {
                prev = sorted[currentIndex - 1];
            }
            
            const alerts = [];
            const prevTime = new Date(prev.date).getTime();
            const daysDiff = Math.round((curTime - prevTime) / (1000 * 60 * 60 * 24));
            const monthsLabel = daysDiff >= 75 ? `${Math.round(daysDiff/30)}個月前` : `${daysDiff}天前`;
            
            const getNum = (v) => (v !== '' && v !== null && v !== undefined && !isNaN(parseFloat(v))) ? parseFloat(v) : null;
            
            // 1. Weight / BMI alert
            const curWeight = getNum(cur.weight);
            const prevWeight = getNum(prev.weight);
            if (curWeight !== null && prevWeight !== null) {
                const pct = (curWeight - prevWeight) / prevWeight * 100;
                if (daysDiff <= 45 && pct >= 5) {
                    alerts.push({
                        type: 'danger',
                        metric: '體重 / BMI',
                        desc: `1個月內體重急速增加 ${pct.toFixed(1)}% (${prevWeight}kg → ${curWeight}kg)`,
                        significance: '急速體重上升成倍增加罹患心血管疾病的機率（APA/FDA精神科指引定義顯著上升）。'
                    });
                } else if (pct >= 7) {
                    alerts.push({
                        type: 'danger',
                        metric: '體重 / BMI',
                        desc: `比${monthsLabel}體重增加 ${pct.toFixed(1)}% (${prevWeight}kg → ${curWeight}kg)`,
                        significance: '基準體重增加 7% 被定義為臨床顯著之體重增加，會顯著提高代謝性與心臟血管疾病風險。'
                    });
                }

                // Weight abnormal loss checking (New)
                const lossPct = -pct;
                if (daysDiff <= 45 && lossPct >= 5) {
                    alerts.push({
                        type: 'danger',
                        metric: '體重 / BMI',
                        desc: `1個月內體重不正常下降 ${lossPct.toFixed(1)}% (${prevWeight}kg → ${curWeight}kg)`,
                        significance: '非預期之急性體重下降可能代表營養不良、藥物副作用或潛在身體健康退化。'
                    });
                } else if (lossPct >= 7) {
                    alerts.push({
                        type: 'danger',
                        metric: '體重 / BMI',
                        desc: `比${monthsLabel}體重顯著減少 ${lossPct.toFixed(1)}% (${prevWeight}kg → ${curWeight}kg)`,
                        significance: '3至6個月內非預期體重減輕大於等於 7% 為臨床異常體重減輕，高度警戒營養不良或潛在慢性疾病。'
                    });
                }

                // Continuous weight decrease checking (last 3 records) (New)
                if (currentIndex >= 2) {
                    const prev2Weight = getNum(sorted[currentIndex - 2].weight);
                    if (prev2Weight !== null && curWeight < prevWeight && prevWeight < prev2Weight) {
                        const hasLossAlert = alerts.some(a => a.metric === '體重 / BMI' && (a.desc.includes('下降') || a.desc.includes('減少')));
                        if (!hasLossAlert) {
                            alerts.push({
                                type: 'warning',
                                metric: '體重 / BMI',
                                desc: `體重呈連續下降趨勢 (前次：${prev2Weight}kg → 上次：${prevWeight}kg → 本次：${curWeight}kg)`,
                                significance: '體重連續下降可能代表吞嚥困難、食慾不振或肌少症進展，建請關注學員的營養攝取與日常進食狀況。'
                            });
                        }
                    }
                }
            }
            
            // 2. Visceral Fat alert
            const curVis = getNum(cur.visceral_fat);
            const prevVis = getNum(prev.visceral_fat);
            if (curVis !== null && prevVis !== null) {
                let isRising = curVis > prevVis;
                if (currentIndex >= 2) {
                    const prev2Vis = getNum(sorted[currentIndex - 2].visceral_fat);
                    if (prev2Vis !== null && curVis > prevVis && prevVis > prev2Vis) {
                        isRising = true;
                    }
                }
                if (curVis - prevVis >= 1) {
                    alerts.push({
                        type: 'warning',
                        metric: '內臟脂肪',
                        desc: `比${monthsLabel}內臟脂肪增加 ${curVis - prevVis} 級 (${prevVis} → ${curVis})`,
                        significance: '內臟脂肪與胰島素阻抗高度相關，是代謝症候群核心指標。藥物易改變脂肪分佈。'
                    });
                } else if (isRising && curVis > prevVis) {
                    alerts.push({
                        type: 'warning',
                        metric: '內臟脂肪',
                        desc: `內臟脂肪呈連續上升趨勢 (${prevVis} → ${curVis})`,
                        significance: '內臟脂肪連續上升代表脂肪優先囤積於內臟器官周圍，高度警示胰島素阻抗與代謝症候群風險。'
                    });
                }
            }
            
            // 3. Body Fat alert: increase > 2%
            const curFat = getNum(cur.body_fat);
            const prevFat = getNum(prev.body_fat);
            if (curFat !== null && prevFat !== null) {
                const diff = curFat - prevFat;
                if (diff >= 2) {
                    alerts.push({
                        type: 'warning',
                        metric: '體脂肪率',
                        desc: `比${monthsLabel}體脂率增加 ${diff.toFixed(1)}% (${prevFat}% → ${curFat}%)`,
                        significance: '常因動機缺乏與活動量低導致脂肪堆積，且體脂肪增加往往早於 BMI 的變化。'
                    });
                }
            }
            
            // 4. Muscle Percent alert: decrease >= 1%
            const curMus = getNum(cur.muscle_percent);
            const prevMus = getNum(prev.muscle_percent);
            if (curMus !== null && prevMus !== null) {
                const diff = prevMus - curMus;
                if (diff >= 1) {
                    alerts.push({
                        type: 'danger',
                        metric: '骨骼肌率',
                        desc: `比${monthsLabel}骨骼肌率流失 ${diff.toFixed(1)}% (${prevMus}% → ${curMus}%)`,
                        significance: '需警戒肌少性肥胖 (Sarcopenic obesity)。若體重持平但體脂上升且骨骼肌流失，代表肌肉正被脂肪取代。'
                    });
                }
            }
            
            // 5. 6MWT alert: decrease >= 20m
            const curWalk = getNum(cur.walk_6m);
            const prevWalk = getNum(prev.walk_6m);
            if (curWalk !== null && prevWalk !== null) {
                const diff = prevWalk - curWalk;
                if (diff >= 20) {
                    alerts.push({
                        type: 'danger',
                        metric: '6分鐘行走 (6MWT)',
                        desc: `比${monthsLabel}距離減少 ${diff.toFixed(0)}m (${prevWalk}m → ${curWalk}m)`,
                        significance: '心肺耐力衰退。步行距離減少 20~30 公尺以上，代表患者心肺功能與功能性活動能力發生患者可感知的實質衰退。'
                    });
                }
            }
            
            // 6. 30s CST alert: decrease >= 2 or total < 6
            const curStand = getNum(cur.sit_stand_30s);
            const prevStand = getNum(prev.sit_stand_30s);
            if (curStand !== null) {
                if (prevStand !== null && (prevStand - curStand >= 2)) {
                    alerts.push({
                        type: 'danger',
                        metric: '30秒坐站 (30s-CST)',
                        desc: `比${monthsLabel}坐站次數減少 ${prevStand - curStand} 次 (${prevStand}次 → ${curStand}次)`,
                        significance: '下肢肌力流失。次數急降代表下肢肌力與耐力衰退，會大幅增加跌倒與失能風險。'
                    });
                } else if (curStand < 6) {
                    alerts.push({
                        type: 'danger',
                        metric: '30秒坐站 (30s-CST)',
                        desc: `總次數極低，僅為 ${curStand} 次 (少於 6~8 次)`,
                        significance: '下肢爆發力極度不足，大幅增加日常活動障礙與跌倒失能風險。'
                    });
                }
            }
            
            // 7. Sit-ups alert: decrease >= 15%
            const curSit = getNum(cur.sit_ups_1m);
            const prevSit = getNum(prev.sit_ups_1m);
            if (curSit !== null && prevSit !== null && prevSit > 0) {
                const pct = (prevSit - curSit) / prevSit * 100;
                if (pct >= 15) {
                    alerts.push({
                        type: 'warning',
                        metric: '仰臥起坐 (1分鐘)',
                        desc: `比${monthsLabel}核心肌力減少 ${pct.toFixed(0)}% (${prevSit}次 → ${curSit}次)`,
                        significance: '核心肌群是維持姿勢的關鍵。久坐不動核心肌力流失迅速，易致姿勢不良及下背痛。'
                    });
                }
            }
            
            // 8. Flexibility alert: decrease >= 2cm
            const curFlex = getNum(cur.flexibility);
            const prevFlex = getNum(prev.flexibility);
            if (curFlex !== null && prevFlex !== null) {
                const diff = prevFlex - curFlex;
                if (diff >= 2) {
                    alerts.push({
                        type: 'warning',
                        metric: '柔軟度 (坐姿體前彎)',
                        desc: `比${monthsLabel}柔軟度退步 ${diff.toFixed(1)}cm (${prevFlex}cm → ${curFlex}cm)`,
                        significance: '腿後肌群與下背柔軟度退步。長期缺乏活動會使關節活動度受限，影響日常步態。'
                    });
                }
            }
            
            return alerts;
        };
        
        const normalizeScore = (val, target, type = 'higher_better') => {
            if (!val || !target) return 0;
            let score = type === 'higher_better' ? (val / target) * 100 : val <= target ? 100 : (target / val) * 100;
            return Math.min(Math.max(score, 10), 120);
        };

        // --- 主程式 ---
        const Dashboard = () => {
            // ★★★ 關鍵修改處：已填入你的 GAS 網址 ★★★
            const API_URL = "https://script.google.com/macros/s/AKfycbzekI8XHd-ZaT32mCqHzaatmOhB5LSZzNZyfHFIEqkkCUGESm1SCBPO3Hu63mgRUjxEWA/exec";
        
            // 使用 State 存密碼與登入狀態
            const [apiPass, setApiPass] = useState(""); 
            const [isLoggedIn, setIsLoggedIn] = useState(false);

            const [data, setData] = useState([]);
            const [currentPage, setCurrentPage] = useState('population');
            const [isLoading, setIsLoading] = useState(false);
            
            const [selectedIndividualSession, setSelectedIndividualSession] = useState("");
            const [selectedIndividualKey, setSelectedIndividualKey] = useState("");
            const [geminiApiKey, setGeminiApiKey] = useState(localStorage.getItem("gemini_api_key") || "");
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            
            const processData = (rawData) => {
                return rawData.map(row => {
                    const bmi = calcBMI(row.height, row.weight);
                    const smi = calcSMI(row.height, row.weight, row.muscle_percent);
                    const whr = (row.waist && row.hip) ? row.waist / row.hip : '';
                    const predicted6m = (row.height && row.weight && row.age) ? calc6MWTPredicted(row.sex, row.age, row.height, row.weight) : '';
                    const bmrTarget = row.age ? getBMRTarget(row.sex, row.age) : '';
                    const bmrStatus = (row.bmr && bmrTarget) ? ((row.bmr < bmrTarget * 0.9) ? "偏低" : (row.bmr > bmrTarget * 1.1) ? "偏高" : "標準") : "-";

                    return {
                        ...row,
                        bmi: bmi !== '' ? parseFloat(bmi.toFixed(1)) : '',
                        smi: smi !== '' ? parseFloat(smi.toFixed(1)) : '',
                        whr: whr !== '' ? parseFloat(whr.toFixed(2)) : '',
                        predicted_walk_6m: predicted6m !== '' ? parseFloat(predicted6m.toFixed(0)) : '',
                        bmi_status: bmi !== '' ? getBMIStatus(bmi) : '-',
                        sarcopenia_status: smi !== '' ? getSarcopeniaStatus(row.sex, smi) : '-',
                        visceral_status: row.visceral_fat !== '' ? getVisceralFatStatus(row.visceral_fat) : '-',
                        body_fat_status: (row.sex && row.body_fat !== '') ? getBodyFatStatus(row.sex, row.body_fat) : '-',
                        muscle_status: (row.sex && row.muscle_percent !== '') ? getMuscleStatus(row.sex, row.muscle_percent) : '-',
                        whr_status: (row.sex && whr !== '') ? getWHRStatus(row.sex, whr) : '-',
                        bmr_status: bmrStatus
                    };
                });
            };

            // 從 Google Sheets 抓取資料 (GET)
            const fetchData = async () => {
                setIsLoading(true);
                try {
                   // 使用使用者輸入的 apiPass
                    const res = await fetch(`${API_URL}?password=${apiPass}`);
                    const json = await res.json();
                    
                    if (json.status === 'success') {
                        // 將 GAS 回傳的資料對應回前端欄位
                        const sheetData = json.data.map(row => mapRowToData(row));
                        setData(processData(sheetData));
                    } else {
                        console.error("API Error: " + json.message);
                        alert("讀取資料失敗：" + json.message);
                    }
                } catch (err) {
                    console.error("Fetch Error:", err);
                    alert("無法連線到資料庫，請檢查網路連線。");
                } finally {
                    setIsLoading(false);
                }
            };


            // --- Page 1: 族群概況 ---
            const PopulationView = () => {
                const allDates = [...new Set(data.map(d => d.session))].filter(Boolean).sort();
                const [selectedDates, setSelectedDates] = useState([]);

                useEffect(() => {
                    if (allDates.length > 0 && selectedDates.length === 0) {
                        setSelectedDates(allDates);
                    }
                }, [data]);

                const toggleDate = (d) => setSelectedDates(prev => prev.includes(d) ? prev.filter(x=>x!==d) : [...prev,d]);
                const filteredData = data.filter(d => selectedDates.length === 0 || selectedDates.includes(d.session));
                
                const latestMap = new Map();
                filteredData.forEach(d => {
                    const key = `${d.name}_${d.dob}`;
                    if (!latestMap.has(key) || d.date > latestMap.get(key).date) {
                        latestMap.set(key, d);
                    }
                });
                const latestRecords = Array.from(latestMap.values());
                const totalPeople = latestRecords.length;
                const males = latestRecords.filter(d => d.sex === '男').length;
                
                const recordsWithAge = latestRecords.filter(d => d.age !== '' && d.age !== undefined && d.age !== null && !isNaN(parseFloat(d.age)));
                const avgAge = recordsWithAge.length ? (recordsWithAge.reduce((a,b) => a + Number(b.age), 0) / recordsWithAge.length).toFixed(1) : 0;
                
                const riskSarcopenia = latestRecords.filter(d => d.sarcopenia_status === '肌少症').length;
                const riskVisceral = latestRecords.filter(d => d.visceral_status !== '標準').length;
                const riskObesity = latestRecords.filter(d => ['中度肥胖', '重度肥胖', '過重'].includes(d.bmi_status)).length;
                const riskFlexibility = latestRecords.filter(d => d.flexibility !== '' && d.flexibility !== undefined && d.flexibility !== null && !isNaN(parseFloat(d.flexibility)) && parseFloat(d.flexibility) < 20).length;

                const datesForChart = selectedDates.length > 0 ? selectedDates.sort() : allDates;
                const getAvg = (session, field) => {
                    const dayData = data.filter(d => d.session === session && d[field] !== '' && d[field] !== undefined && d[field] !== null && !isNaN(parseFloat(d[field])));
                    return dayData.length ? parseFloat((dayData.reduce((a,b)=>a+Number(b[field]),0)/dayData.length).toFixed(1)) : null;
                };

                const bodyDatasets = [
                    { label: '體重', data: datesForChart.map(d=>getAvg(d,'weight')), borderColor: '#ef4444' }, 
                    { label: 'BMI', data: datesForChart.map(d=>getAvg(d,'bmi')), borderColor: '#8b5cf6' },
                    { label: '骨骼肌', data: datesForChart.map(d=>getAvg(d,'muscle_percent')), borderColor: '#10b981' },
                    { label: '體脂率', data: datesForChart.map(d=>getAvg(d,'body_fat')), borderColor: '#f59e0b' },
                    { label: '內臟脂肪', data: datesForChart.map(d=>getAvg(d,'visceral_fat')), borderColor: '#2563eb' }
                ];
                
                const fitnessDatasets = [
                    { label: '6分鐘行走', data: datesForChart.map(d=>getAvg(d,'walk_6m')), borderColor: '#8b5cf6' },
                    { label: '30秒坐站', data: datesForChart.map(d=>getAvg(d,'sit_stand_30s')), borderColor: '#ec4899' },
                    { label: '仰臥起坐', data: datesForChart.map(d=>getAvg(d,'sit_ups_1m')), borderColor: '#f59e0b' },
                    { label: '柔軟度', data: datesForChart.map(d=>getAvg(d,'flexibility')), borderColor: '#06b6d4' }
                ];

                return (
                    <div className="space-y-6 animate-fade-in pb-12">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">全體學員健康風險儀表板</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                                <div className="text-center p-3 bg-gray-50 rounded"><p className="text-gray-500 text-sm">總評估人數</p><p className="text-2xl font-bold">{totalPeople} 人</p></div>
                                <div className="text-center p-3 bg-gray-50 rounded"><p className="text-gray-500 text-sm">男女比例</p><p className="text-2xl font-bold text-blue-600">{males} : <span className="text-pink-500">{totalPeople-males}</span></p></div>
                                <div className="text-center p-3 bg-gray-50 rounded"><p className="text-gray-500 text-sm">平均年齡</p><p className="text-2xl font-bold">{avgAge} 歲</p></div>
                                
                                <div className="text-center p-3 bg-gray-50 rounded relative dropdown group cursor-pointer">
                                    <p className="text-gray-500 text-sm mb-1">評估次別篩選 (可複選) ▾</p>
                                    <div className="font-bold text-lg text-blue-600">{selectedDates.length} 個</div>
                                    <div className="dropdown-content left-0 right-0 mx-auto">
                                        {allDates.map(d => (
                                            <label key={d} className="flex items-center space-x-2 p-2 hover:bg-gray-100 cursor-pointer text-left text-sm border-b">
                                                <input type="checkbox" checked={selectedDates.includes(d)} onChange={() => toggleDate(d)} className="form-checkbox h-4 w-4 text-blue-600" />
                                                <span>{d}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                {[
                                    { t: "肌少症風險", c: riskSarcopenia, color: "orange" }, { t: "內臟脂肪過高", c: riskVisceral, color: "red" },
                                    { t: "BMI肥胖/過重", c: riskObesity, color: "blue" }, { t: "柔軟度不佳", c: riskFlexibility, color: "purple" }
                                ].map((r, i) => (
                                    <div key={i} className={`p-4 rounded-lg border-l-4 shadow-sm bg-white border-${r.color}-500`}>
                                        <h3 className="text-gray-500 text-sm">{r.t}</h3>
                                        <div className="flex items-end gap-2 mt-1"><span className="text-2xl font-bold">{r.c}</span><span className="text-sm text-gray-400">/ {totalPeople} ({totalPeople?Math.round(r.c/totalPeople*100):0}%)</span></div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <InteractiveChart title="身體素質平均分析" datasets={bodyDatasets} labels={datesForChart} />
                            <InteractiveChart title="體能表現平均分析" datasets={fitnessDatasets} labels={datesForChart} />
                        </div>
                    </div>
                );
            };

            // --- Page 2: 個案報告 ---
            const IndividualReportView = ({ selSession, setSelSession, selKey, setSelKey }) => {
                // Pre-process data to resolve empty DOBs
                const normalizedData = useMemo(() => {
                    // 1. Group all non-empty DOBs by name
                    const nameToDobs = {};
                    data.forEach(d => {

                                                                    <tr><td className="border p-1 whitespace-nowrap">6分鐘行走</td><td className="border p-1 whitespace-nowrap font-bold">{(typeof pCurrent.walk_6m === 'number' && pCurrent.walk_6m !== '') ? pCurrent.walk_6m.toFixed(1) + " m" : "-"}</td><td className={`border p-1 whitespace-nowrap ${pWalkStd.c || ""}`}>{pWalkStd.s || "-"}</td></tr>
                                                                    <tr><td className="border p-1 whitespace-nowrap">柔軟度</td><td className="border p-1 whitespace-nowrap font-bold">{(typeof pCurrent.flexibility === 'number' && pCurrent.flexibility !== '') ? pCurrent.flexibility.toFixed(1) + " cm" : "-"}</td><td className={`border p-1 whitespace-nowrap ${pFlexStd.color || ""}`}>{pFlexStd.status || "-"}</td></tr>
                                                                    <tr><td className="border p-1 whitespace-nowrap">仰臥起坐</td><td className="border p-1 whitespace-nowrap font-bold">{(typeof pCurrent.sit_ups_1m === 'number' && pCurrent.sit_ups_1m !== '') ? pCurrent.sit_ups_1m.toFixed(1) + " 次" : "-"}</td><td className={`border p-1 whitespace-nowrap ${pSitUpsStd.color || ""}`}>{pSitUpsStd.status || "-"}</td></tr>
                                                                </tbody>
                                                            </table>
                                                            
                                                            <div className="mt-auto bg-orange-50 p-2 rounded flex-grow flex flex-col text-xs leading-relaxed border border-orange-100">
                                                                <h4 className="font-bold text-orange-800 mb-1 border-b border-orange-200 pb-1 text-base"><i className="fas fa-user-md mr-1"></i>OT 綜合評語與建議</h4>
                                                                <div className="mb-2 text-justify whitespace-pre-line leading-snug flex-grow text-[11px]">
                                                                    {pOtAnalysis}
                                                                </div>

                                                                <div className="grid grid-cols-1 gap-1.5 mt-1">
                                                                    <div className="bg-white p-1.5 rounded border border-green-200">
                                                                        <strong className="text-green-700 flex items-center mb-1 text-sm justify-between">
                                                                            <span><i className="fas fa-dumbbell mr-1"></i>運動處方</span>
                                                                            <span className="text-[10px] bg-green-100 px-1 rounded">頻率: 每週3次</span>
                                                                        </strong>
                                                                        {pCurrent.exercise_comments ? (
                                                                            renderListComments(pCurrent.exercise_comments)
                                                                        ) : (
                                                                            <ul className="list-disc pl-4 space-y-0.5 text-gray-700 text-[11px]">
                                                                                {pCurrent.sarcopenia_status === '肌少症' ? <li><strong>阻力：</strong>彈力帶胸推、深蹲 (3組x10次)，增加肌肉量。</li> : null}
                                                                                {(pCurrent.walk_6m && pCurrent.predicted_walk_6m && pCurrent.walk_6m < pCurrent.predicted_walk_6m) ? <li><strong>有氧：</strong>快走/單車 (20分/次)，強度自覺稍微喘。</li> : null}
                                                                                {(pCurrent.flexibility && pCurrent.flexibility < 20) ? <li><strong>伸展：</strong>貓牛式、腿後伸展，停留15秒，勿憋氣。</li> : null}
                                                                                {(pCurrent.sarcopenia_status && pCurrent.sarcopenia_status !== '肌少症' && pCurrent.walk_6m && pCurrent.predicted_walk_6m && pCurrent.walk_6m >= pCurrent.predicted_walk_6m) ? <li><strong>維持：</strong>保持現有活動，可嘗試間歇運動增加強度。</li> : null}
                                                                                <li className="text-gray-500 mt-0.5 pt-0.5 border-t border-dashed"><strong>注意：</strong>運動時若感頭暈心悸請立即停止並休息。</li>
                                                                            </ul>
                                                                        )}
                                                                    </div>
                                                                    <div className="bg-white p-1.5 rounded border border-red-200">
                                                                        <strong className="text-red-700 flex items-center mb-1 text-sm"><i className="fas fa-utensils mr-1"></i>營養建議</strong>
                                                                        {pCurrent.nutrition_comments ? (
                                                                            renderListComments(pCurrent.nutrition_comments)
                                                                        ) : (
                                                                            <ul className="list-disc pl-4 space-y-0.5 text-gray-700 text-[11px]">
                                                                                {(pCurrent.bmi && pCurrent.bmi > 24) ? <li><strong>控糖：</strong>減少含糖飲料，精緻澱粉減半，多吃高纖蔬菜。</li> : null}
                                                                                {pCurrent.smi !== '' ? (pCurrent.smi < 7 ? <li><strong>增肌：</strong>運動後30分內補充蛋白質(豆漿/茶葉蛋)。</li> : <li><strong>均衡：</strong>每餐蔬菜大於拳頭大，每日飲水2000cc。</li>) : <li><strong>均衡：</strong>每餐蔬菜大於拳頭大，每日飲水2000cc。</li>}
                                                                                <li><strong>骨骼：</strong>每日早晚一杯奶或補充小魚乾、黑芝麻。</li>
                                                                            </ul>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Page 2 */}
                                                <div className="pdf-page p-8 relative" style={{ height: '275mm', width: '100%', overflow: 'hidden', pageBreakAfter: idx === peopleInSession.length - 1 ? 'auto' : 'always', position: 'relative', background: 'white' }}>
                                                    <div className="border-b-4 border-gray-600 pb-4 mb-6 text-center">
                                                        <h1 className="text-3xl font-bold text-gray-800">歷程追蹤 analysis 報告</h1>
                                                        <p className="text-gray-500 mt-2">學員: {pCurrent.name} ( {formatDateToRoc(pDates[0])} ~ {formatDateToRoc(pDates[pDates.length-1])} )</p>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-6 h-[800px]">
                                                        <InteractiveChart title="身體組成 (體重/體脂/骨骼肌)" datasets={pChartGroup1} labels={pDates.map(formatDateToRoc)} initialSelected={['體重', '骨骼肌']} options={{ animation: false }} />
                                                        <InteractiveChart title="身體指標 (內臟脂肪/柔軟度)" datasets={pChartGroup2} labels={pDates.map(formatDateToRoc)} initialSelected={['內臟脂肪']} options={{ animation: false }} />
                                                        <InteractiveChart title="肌力表現 (坐站/仰臥)" datasets={pChartGroup3} labels={pDates.map(formatDateToRoc)} options={{ animation: false }} />
                                                        <InteractiveChart title="心肺耐力 (6分鐘行走)" datasets={pChartGroup4} labels={pDates.map(formatDateToRoc)} options={{ animation: false }} />
