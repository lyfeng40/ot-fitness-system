                );
            };

            // --- Page 3: 資料輸入 ---
            const DataEntryView = () => {
                const [form, setForm] = useState({ 
                    date: new Date().toISOString().split('T')[0], bed_number: '', name: '', 
                    dob: '', age: '', sex: '男',
                    height: '', weight: '', waist: '', hip: '', 
                    body_fat: '', muscle_percent: '', visceral_fat: '', body_age: '', bmr: '',
                    sit_stand_30s: '', walk_6m: '', flexibility: '', sit_ups_1m: '',
                    ot_comments: '', exercise_comments: '', nutrition_comments: ''
                });
                const [isSubmitting, setIsSubmitting] = useState(false);

                const handleChange = (e) => {
                    const { name, value } = e.target;
                    let newForm = { ...form, [name]: value };
                    if (name === 'dob') newForm.age = calcAge(value);
                    setForm(newForm);
                };

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setIsSubmitting(true);

                    const height = form.height !== '' ? parseFloat(form.height) : '';
                    const weight = form.weight !== '' ? parseFloat(form.weight) : '';
                    const muscle_percent = form.muscle_percent !== '' ? parseFloat(form.muscle_percent) : '';
                    const body_fat = form.body_fat !== '' ? parseFloat(form.body_fat) : '';
                    const visceral_fat = form.visceral_fat !== '' ? parseFloat(form.visceral_fat) : '';
                    const body_age = form.body_age !== '' ? parseInt(form.body_age, 10) : '';
                    const bmr = form.bmr !== '' ? parseFloat(form.bmr) : '';
                    const waist = form.waist !== '' ? parseFloat(form.waist) : '';
                    const hip = form.hip !== '' ? parseFloat(form.hip) : '';
                    
                    const sit_ups_1m = form.sit_ups_1m !== '' ? parseFloat(form.sit_ups_1m) : '';
                    const walk_6m = form.walk_6m !== '' ? parseFloat(form.walk_6m) : '';
                    const flexibility = form.flexibility !== '' ? parseFloat(form.flexibility) : '';
                    const sit_stand_30s = form.sit_stand_30s !== '' ? parseFloat(form.sit_stand_30s) : '';

                    const bmi = (typeof height === 'number' && typeof weight === 'number') ? calcBMI(height, weight) : '';
                    const smi = (typeof height === 'number' && typeof weight === 'number' && typeof muscle_percent === 'number') ? calcSMI(height, weight, muscle_percent) : '';
                    const muscle_kg = (typeof weight === 'number' && typeof muscle_percent === 'number') ? (weight * muscle_percent / 100).toFixed(1) : '';
                    const whr = (typeof waist === 'number' && typeof hip === 'number' && hip !== 0) ? (waist / hip).toFixed(2) : '';

                    const sessionVal = getRocSessionFromGregorian(form.date) || '1';
                    const idVal = `${form.bed_number || 'unknown'}_${sessionVal}`;

                    const payload = {
                        password: apiPass,
                        id: idVal,
                        '唯一識別碼': idVal,
                        
                        bed_number: form.bed_number,
                        '床號': form.bed_number,
                        
                        name: form.name,
                        '姓名': form.name,
                        
                        sex: form.sex,
                        '性別': form.sex,
                        
                        dob: form.dob,
                        '出生年月日': form.dob,
                        
                        age: form.age !== '' ? Number(form.age) : '',
                        '年齡': form.age !== '' ? Number(form.age) : '',
                        
                        session: sessionVal,
                        '評估次別': sessionVal,
                        
                        date: form.date,
                        eval_date: form.date,
                        assessment_date: form.date,
                        '評估日期': form.date,
                        
                        height: height,
                        '身高(cm)': height,
                        
                        weight: weight,
                        '體重(kg)': weight,
                        
                        bmi: bmi !== '' ? Number(bmi.toFixed(1)) : '',
                        'BMI': bmi !== '' ? Number(bmi.toFixed(1)) : '',
                        
                        body_fat: body_fat,
                        '體脂肪(%)': body_fat,
                        
                        muscle_percent: muscle_percent,
                        '骨骼肌(%)': muscle_percent,
                        
                        muscle_kg: muscle_kg !== '' ? Number(muscle_kg) : '',
                        '骨骼肌(kg)': muscle_kg !== '' ? Number(muscle_kg) : '',
                        
                        smi: smi !== '' ? Number(smi.toFixed(1)) : '',
                        'SMI': smi !== '' ? Number(smi.toFixed(1)) : '',
                        
                        bmr: bmr,
                        '基礎代謝(kcal)': bmr,
                        
                        body_age: body_age,
                        '體年齡': body_age,
                        
                        visceral_fat: visceral_fat,
                        '內臟脂肪': visceral_fat,
                        
                        waist: waist,
                        '腰圍(cm)': waist,
                        
                        hip: hip,
                        '臀圍(cm)': hip,
                        
                        whr: whr !== '' ? Number(whr) : '',
                        '腰臀比': whr !== '' ? Number(whr) : '',
                        
                        sit_ups_1m: sit_ups_1m,
                        '一分鐘仰臥起坐(次)': sit_ups_1m,
                        
                        walk_6m: walk_6m,
                        '六分鐘行走測驗(m)': walk_6m,
                        
                        flexibility: flexibility,
                        '柔軟度(cm)': flexibility,
                        
                        sit_stand_30s: sit_stand_30s,
                        '30秒坐站測驗(次)': sit_stand_30s,

                        ot_comments: form.ot_comments,
                        '職能治療評語與綜合分析': form.ot_comments,
                        '職能治療評語': form.ot_comments,

                        exercise_comments: form.exercise_comments,
                        '運動處方建議': form.exercise_comments,
                        '運動建議': form.exercise_comments,

                        nutrition_comments: form.nutrition_comments,
                        '營養建議': form.nutrition_comments,
                        '營養處方建議': form.nutrition_comments
                    };

                    try {
                        const res = await fetch(API_URL, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify(payload)
                        });
                        const json = await res.json();
                        
                        if (json.status === 'success') {
                            // Cache locally in case spreadsheet columns are not configured
                            localStorage.setItem(`ot_comments_${idVal}_${sessionVal}`, form.ot_comments || '');
                            localStorage.setItem(`exercise_comments_${idVal}_${sessionVal}`, form.exercise_comments || '');
                            localStorage.setItem(`nutrition_comments_${idVal}_${sessionVal}`, form.nutrition_comments || '');

                            alert("✅ 資料已成功儲存到 Google Sheets！");
                            fetchData();
                            setForm({ 
                                ...form, 
                                name: '', 
                                bed_number: '',
                                ot_comments: '',
                                exercise_comments: '',
                                nutrition_comments: ''
                            });
                        } else {
                            alert("❌ 儲存失敗：" + json.message);
                        }
                    } catch (err) {
                        console.error(err);
                        alert("儲存時發生錯誤 (請確認網路或 API 網址是否正確)");
                    } finally {
                        setIsSubmitting(false);
                    }
                };

                return (
                    <div className="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-sm">
                        <div className="flex justify-between items-center mb-6 border-b pb-4">
                            <h2 className="text-2xl font-bold text-gray-800">資料輸入 (上傳至雲端)</h2>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="space-y-4">
                                <h3 className="font-bold text-blue-800 border-l-4 border-blue-600 pl-2">1. 基本資料</h3>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <label className="block text-sm">評估日期 <input required type="date" name="date" value={form.date} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">床號 <input type="text" name="bed_number" value={form.bed_number} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">姓名 <input required type="text" name="name" value={form.name} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">性別 <select name="sex" value={form.sex} onChange={handleChange} className="w-full border p-2 rounded"><option>男</option><option>女</option></select></label>
                                    <label className="block text-sm">出生年月日 <input type="date" name="dob" value={form.dob} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">年齡 (自動) <input type="number" readOnly name="age" value={form.age} className="w-full border p-2 rounded bg-gray-100" /></label>
                                </div>
                            </div>
                            <div className="space-y-4">
                                <h3 className="font-bold text-blue-800 border-l-4 border-blue-600 pl-2">2. 身體素質</h3>
                                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                    <label className="block text-sm">身高 (cm) <input type="number" name="height" value={form.height} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">體重 (kg) <input type="number" name="weight" value={form.weight} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">腰圍 (cm) <input type="number" name="waist" value={form.waist} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">臀圍 (cm) <input type="number" name="hip" value={form.hip} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">體脂率 (%) <input type="number" name="body_fat" value={form.body_fat} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">骨骼肌 (%) <input type="number" name="muscle_percent" value={form.muscle_percent} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">內臟脂肪 <input type="number" name="visceral_fat" value={form.visceral_fat} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">體年齡 <input type="number" name="body_age" value={form.body_age} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">基礎代謝 <input type="number" name="bmr" value={form.bmr} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                </div>
                            </div>
                            <div className="space-y-4">
                                <h3 className="font-bold text-blue-800 border-l-4 border-blue-600 pl-2">3. 體能表現</h3>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <label className="block text-sm">30秒坐站 (次) <input type="number" name="sit_stand_30s" value={form.sit_stand_30s} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">6分鐘行走 (m) <input type="number" name="walk_6m" value={form.walk_6m} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">柔軟度 (cm) <input type="number" name="flexibility" value={form.flexibility} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                    <label className="block text-sm">仰臥起坐 (次) <input type="number" name="sit_ups_1m" value={form.sit_ups_1m} onChange={handleChange} className="w-full border p-2 rounded" /></label>
                                </div>
                            </div>
                            <div className="space-y-4">
                                <h3 className="font-bold text-blue-800 border-l-4 border-blue-600 pl-2">4. 治療師評語與處方建議 (選填，留空將自動以評估結果生成智慧建議)</h3>
                                <div className="grid grid-cols-1 gap-4">
                                    <label className="block text-sm">職能治療評語 <textarea name="ot_comments" value={form.ot_comments} onChange={handleChange} placeholder="請輸入個別化職能治療評語（將直接呈現在報告中，留空將以評估結果自動產生）" rows="3" className="w-full border p-2 rounded"></textarea></label>
                                    <label className="block text-sm">運動處方建議 <textarea name="exercise_comments" value={form.exercise_comments} onChange={handleChange} placeholder="請輸入個別化運動建議（將直接呈現在報告中，留空將以評估結果自動產生）" rows="3" className="w-full border p-2 rounded"></textarea></label>
                                    <label className="block text-sm">營養建議 <textarea name="nutrition_comments" value={form.nutrition_comments} onChange={handleChange} placeholder="請輸入個別化營養建議（將直接呈現在報告中，留空將以評估結果自動產生）" rows="3" className="w-full border p-2 rounded"></textarea></label>
                                </div>
                            </div>
                            <button type="submit" disabled={isSubmitting} className={`w-full py-3 rounded-lg font-bold shadow text-white ${isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {isSubmitting ? "資料上傳中..." : "新增並上傳資料"}
                            </button>
                        </form>
                    </div>
                );
            };

            // --- Page 4: 健康預警 ---
            const AlertsView = () => {
                const [searchTerm, setSearchTerm] = useState("");

                const sessions = useMemo(() => {
                    return [...new Set(data.map(d => d.session))].filter(Boolean).sort();
                }, [data]);

                const latestSession = sessions.length > 0 ? sessions[sessions.length - 1] : "";

                const alertsList = useMemo(() => {
                    const list = [];
                    if (!latestSession) return [];

                    // Group records by person
                    const peopleMap = {};
                    data.forEach(d => {
                        const key = `${d.name}_${d.dob}`;
                        if (!peopleMap[key]) peopleMap[key] = [];
                        peopleMap[key].push(d);
                    });

                    // For each person, only process if they participated in the latest session
                    Object.keys(peopleMap).forEach(key => {
                        const personRecords = peopleMap[key].sort((a,b) => a.date.localeCompare(b.date));
                        
                        // Check if they have a record in the latest session
                        const hasLatestRecord = personRecords.some(r => r.session === latestSession);
                        if (!hasLatestRecord) return; // Skip if they didn't participate in the latest session

                        const latest = personRecords[personRecords.length - 1];
                        const warnings = getClinicalAlerts(personRecords, latest);
                        if (warnings.length > 0) {
                            list.push({
                                name: latest.name,
                                dob: latest.dob,
                                bed: latest.bed_number,
                                sex: latest.sex,
                                age: latest.age,
                                session: latest.session,
                                date: latest.date,
                                warnings: warnings
                            });
                        }
                    });
                    return list;
                }, [data, latestSession]);

                const filteredAlerts = useMemo(() => {
                    if (!searchTerm) return alertsList;
                    const cleanTerm = searchTerm.trim();
                    return alertsList.filter(p => 
                        p.name.includes(cleanTerm) || 
                        (p.bed && String(p.bed).includes(cleanTerm))
                    );
                }, [alertsList, searchTerm]);

                return (
                    <div className="space-y-6 animate-fade-in pb-12">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            {/* Title block */}
                            <div className="flex flex-col md:flex-row md:items-center justify-between border-b pb-4 mb-4 gap-4">
                                <div>
                                    <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fas fa-bell text-red-500 animate-swing"></i>
                                        學員健康預警與臨床變化追蹤
                                    </h2>
                                    <p className="text-gray-500 text-sm mt-1">
                                        當前分析次別：<strong className="text-blue-600">{latestSession || "無次別"}</strong> (僅顯示本次別參測學員之異常警示)
                                    </p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="relative">
                                        <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                                        <input 
                                            type="text" 
                                            placeholder="搜尋姓名或床號..." 
                                            className="pl-9 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm w-48 md:w-64"
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                        />
                                    </div>
                                    <span className="bg-red-100 text-red-700 text-xs px-3 py-2 rounded-lg font-bold shrink-0">
                                        異常學員：{filteredAlerts.length} / {alertsList.length} 人
                                    </span>
                                </div>
                            </div>

                            {/* Banner explaining criteria */}
                            <div className="bg-slate-50 border border-slate-100 rounded-xl p-4 mb-6 text-xs text-slate-700 leading-relaxed grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="space-y-1.5">
                                    <h4 className="font-bold text-slate-800 text-sm flex items-center gap-1.5"><i className="fas fa-info-circle text-blue-600"></i> 生理指標示警標準 (3-6個月變化)：</h4>
                                    <ul className="list-disc pl-4 space-y-0.5">
                                        <li><strong>體重 / BMI</strong>：急速增減大於等於 5% (1個月內) 或 累計增減大於等於 7%。</li>
                                        <li><strong>內臟脂肪</strong>：內臟脂肪級數連續上升，或增加大於等於 1 級。</li>
                                        <li><strong>體脂肪率</strong>：體脂率增加超過 2%。</li>
                                        <li><strong>骨骼肌率</strong>：流失大於等於 1% (代表肌肉正被脂肪取代，警戒肌少肥胖)。</li>
                                    </ul>
                                </div>
                                <div className="space-y-1.5">
                                    <h4 className="font-bold text-slate-800 text-sm flex items-center gap-1.5"><i className="fas fa-dumbbell text-green-600"></i> 功能性體能示警標準 (3-6個月變化)：</h4>
                                    <ul className="list-disc pl-4 space-y-0.5">
                                        <li><strong>6分鐘行走測驗</strong>：步行距離減少 20 公尺以上 (心肺功能實質衰退)。</li>
                                        <li><strong>30秒坐站次數</strong>：次數減少 2 次以上，或總次數低於 6 次 (跌倒/失能風險)。</li>
                                        <li><strong>核心肌力與柔軟度</strong>：仰臥起坐退步大於等於 15% 或 坐姿體前彎減少大於等於 2 公分。</li>
                                    </ul>
                                </div>
                            </div>

                            {/* List cards */}
                            {filteredAlerts.length === 0 ? (
                                <div className="text-center py-20 text-gray-400">
                                    <i className="fas fa-check-circle text-5xl text-green-500 mb-4"></i>
                                    <p className="font-bold text-gray-600">
                                        {searchTerm ? "沒有找到符合搜尋條件的預警學員。" : "目前本期測評學員的健康指標均在正常範圍內。"}
                                    </p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {filteredAlerts.map((p, idx) => (
                                        <div key={idx} className="border border-red-100 rounded-xl overflow-hidden shadow-sm hover:shadow transition">
                                            {/* Card Header */}
                                            <div className="bg-red-50/50 p-4 border-b border-red-100 flex flex-wrap items-center justify-between gap-2">
                                                <div className="flex items-center gap-3">
                                                    <span className="bg-red-600 text-white text-xs px-2 py-0.5 rounded font-bold">
                                                        {p.bed ? `${p.bed}床` : '無床號'}
                                                    </span>
                                                    <h3 className="text-lg font-bold text-slate-800">{p.name}</h3>
                                                    <span className="text-sm text-gray-500">{p.sex} / {p.age}歲</span>
                                                    <span className="text-xs text-gray-400">出生：{p.dob ? formatDateToRoc(p.dob) : '未填'}</span>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <div className="text-xs text-slate-500 font-bold bg-white px-2 py-1 rounded border border-slate-200">
                                                        最新評估次別：{p.session} ({formatDateToRoc(p.date)})
                                                    </div>
                                                    <button 
                                                        onClick={() => {
                                                            setSelectedIndividualSession(p.session);
                                                            setSelectedIndividualKey(`${p.name}_${p.dob}`);
                                                            setCurrentPage('individual');
                                                        }}
                                                        className="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded shadow-sm flex items-center gap-1 font-bold transition"
                                                    >
                                                        <i className="fas fa-search"></i> 查看個案報告
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Warnings Details */}
                                            <div className="p-4 bg-white grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {p.warnings.map((w, wIdx) => (
                                                    <div key={wIdx} className="bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col justify-between">
                                                        <div>
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <span className={`w-2.5 h-2.5 rounded-full ${w.type === 'danger' ? 'bg-red-500' : 'bg-amber-500'}`}></span>
                                                                <strong className="text-slate-800 text-sm">{w.metric}</strong>
                                                            </div>
                                                            <p className="text-sm text-red-600 font-semibold mb-2">{w.desc}</p>
                                                        </div>
                                                        <div className="text-xs text-gray-500 bg-white p-2 rounded border border-slate-100 mt-2">
                                                            <strong className="text-slate-600">生理與醫學意義：</strong>
                                                            {w.significance}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // --- 新增：登入處理函數 ---
            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    // 嘗試用輸入的密碼連線
                    const res = await fetch(`${API_URL}?password=${apiPass}`);
                    const json = await res.json();
                    
                    if (json.status === 'success') {
                        // 驗證成功，手動執行原本的資料處理邏輯
                        const sheetData = json.data.map(row => mapRowToData(row));
                        setData(processData(sheetData));
                        setIsLoggedIn(true); // 設定為已登入
                    } else {
                        alert("登入失敗"); // 簡潔提示
                    }
                } catch (err) {
                    console.error(err);
                    alert("登入失敗");
                } finally {
                    setIsLoading(false);
                }
            };

            // --- 新增：如果未登入，顯示登入畫面 ---
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-slate-800 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-6">
                                <div className="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i className="fas fa-heartbeat text-4xl text-blue-600"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-gray-800">OT 運動追蹤系統</h1>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <input 
                                        type="password" 
                                        placeholder="請輸入密碼" 
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        value={apiPass}
                                        onChange={(e) => setApiPass(e.target.value)}
                                        autoFocus
                                    />
                                </div>
                                <button 
                                    type="submit" 
                                    disabled={isLoading}
                                    className={`w-full py-3 rounded-lg font-bold text-white shadow transition-all ${isLoading ? 'bg-gray-400' : 'bg-blue-600 hover:bg-blue-700'}`}
                                >
                                    {isLoading ? "驗證中..." : "登入"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }
            return (
                <div className="min-h-screen pb-10 bg-slate-50">
                    <nav className="bg-slate-800 text-white shadow-lg sticky top-0 z-50 no-print">
                        <div className="container mx-auto px-4 flex justify-between items-center h-16">
                            <h1 className="text-xl font-bold flex items-center"><i className="fas fa-heartbeat text-red-400 mr-2"></i>職能治療運動追蹤系統</h1>
                            <div className="flex items-center space-x-2">
                                <div className="flex space-x-1">
                                    {[{id:'population',l:'族群概況',i:'fa-users'},{id:'individual',l:'個案報告',i:'fa-file-medical'},{id:'alerts',l:'健康預警',i:'fa-bell'},{id:'entry',l:'資料輸入',i:'fa-edit'}].map(t => (
                                        <button key={t.id} onClick={()=>setCurrentPage(t.id)} className={`px-4 py-2 rounded transition flex items-center ${currentPage===t.id?'bg-blue-600 text-white':'text-gray-300 hover:bg-slate-700'}`}><i className={`fas ${t.i} mr-2`}></i>{t.l}</button>
                                    ))}
                                </div>
                                <button onClick={() => setShowApiKeyModal(true)} className="p-2 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition flex items-center gap-1.5" title="設定 Gemini API 金鑰">
                                    <i className="fas fa-cog text-lg"></i>
                                    <span className="text-xs hidden md:inline">{geminiApiKey ? "AI金鑰已設定" : "設定 AI 金鑰"}</span>
                                </button>
                            </div>
                        </div>
                    </nav>
                    <main className="container mx-auto mt-8 px-4">
                        {isLoading ? (
                            <div className="text-center py-20 text-blue-600">
                                <i className="fas fa-cloud-download-alt text-4xl mb-4 animate-bounce"></i>
                                <p className="font-bold">正在從 Google Sheets 雲端下載資料...</p>
                                <p className="text-sm text-gray-400 mt-2">連線網址: ...RUjxEWA/exec</p>
                            </div>
                        ) : (
                            data.length === 0 ? <div className="text-center py-20 text-gray-500">尚無資料，請前往「資料輸入」新增一筆。</div> :
                            currentPage === 'population' ? <PopulationView /> : 
                            currentPage === 'individual' ? (
                                <IndividualReportView 
                                    selSession={selectedIndividualSession} 
                                    setSelSession={setSelectedIndividualSession}
                                    selKey={selectedIndividualKey} 
                                    setSelKey={setSelectedIndividualKey} 
                                />
                            ) : 
                            currentPage === 'alerts' ? <AlertsView /> : <DataEntryView />
                        )}
                    </main>

                    {/* Gemini API Key Settings Modal */}
                    {showApiKeyModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full animate-scale-up">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fas fa-key text-blue-600"></i>
                                        設定 Gemini AI 智慧金鑰
                                    </h3>
                                    <button onClick={() => setShowApiKeyModal(false)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <p className="text-xs text-gray-500 leading-relaxed">
                                        本系統使用 Google Gemini API 觀察學員數據並生成個別化建議。此金鑰僅儲存在您的瀏覽器本地，不會上傳到任何伺服器。
                                    </p>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Gemini API Key</label>
                                        <input 
                                            type="password" 
                                            placeholder="AIzaSy..." 
                                            className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-mono"
                                            value={geminiApiKey}
                                            onChange={(e) => setGeminiApiKey(e.target.value)}
                                        />
                                    </div>
                                    <div className="text-[11px] text-blue-600 bg-blue-50 p-2.5 rounded">
                                        <i className="fas fa-info-circle mr-1"></i>
                                        您可以前往 <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer" className="underline font-bold hover:text-blue-800">Google AI Studio</a> 免費申請 API Key。
                                    </div>
                                    <div className="flex gap-2 justify-end pt-2 border-t">
                                        <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 border rounded-lg hover:bg-slate-50 text-sm">取消</button>
                                        <button onClick={() => {
                                            localStorage.setItem("gemini_api_key", geminiApiKey);
                                            setShowApiKeyModal(false);
                                            alert("🔑 API 金鑰已成功儲存！");
                                        }} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm shadow">確認儲存</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }; 

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
